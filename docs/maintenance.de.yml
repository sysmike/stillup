# Die deutsche Fassung von .github/ISSUE_TEMPLATE/maintenance.yml.
#
# Zum Verwenden über die englische Vorlage kopieren:
#
#     cp docs/maintenance.de.yml .github/ISSUE_TEMPLATE/maintenance.yml
#
# und zwei Variablen setzen: MONITORS_HEADING auf "Betroffene Monitore" und
# WINDOW_HEADING auf "Zeitfenster". GitHub macht aus der Beschriftung eines
# Feldes die Überschrift im Issue-Text; daran erkennt die Seite, welche Monitore
# ein Issue betrifft und wann die Arbeiten beginnen. Stimmen Beschriftung und
# Variable nicht überein, bleibt das kommentarlos aus.
#
# Die Labels in `labels:` bleiben unübersetzt: `maintenance` ist reserviert und
# der erste Eintrag muss zu INCIDENT_LABELS passen.

name: Geplante Wartung
description: Ein Wartungsfenster auf der Statusseite ankündigen
title: 'Wartung: '
labels: ['status', 'maintenance']
body:
  - type: markdown
    attributes:
      value: |
        Dieses Issue erscheint auf der Statusseite, solange es offen ist, und
        bleibt bis 30 Tage nach seiner Erstellung gelistet. Schließe es, wenn
        die Arbeiten erledigt sind. Öffnen und Schließen baut die Seite
        innerhalb von ein bis zwei Minuten neu auf.

        Halte den Titel kurz und nenne darin das Zeitfenster, zum Beispiel
        `Wartung: Datenbank-Upgrade, 2026-03-14 02:00 UTC`.
  # Der Beginn wird aus diesem Feld gelesen, damit angekündigte Arbeiten als
  # geplant statt als laufend erscheinen. Das Datum als 2026-03-14 schreiben,
  # die Uhrzeit ist optional.
  - type: input
    id: window
    attributes:
      label: Zeitfenster
      description: Beginn und Ende, in UTC. Mit dem Datum beginnen, etwa 2026-03-14 02:00.
      placeholder: 2026-03-14 02:00 - 04:00 UTC
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Erwartete Auswirkung
      placeholder: Die API antwortet für bis zu zehn Minuten mit 503, während die Datenbank umschaltet.
    validations:
      required: true
  # Die Beschriftung dieses Feldes wird zur Überschrift, nach der gesucht wird.
  # Wer sie ändert, muss MONITORS_HEADING mitändern.
  - type: input
    id: monitors
    attributes:
      label: Betroffene Monitore
      description: Namen wie auf der Statusseite.
      placeholder: Public API, Dokumentation
  - type: textarea
    id: notes
    attributes:
      label: Anmerkungen
      description: Rollback-Plan, Ansprechpartner, Ticketnummern.
