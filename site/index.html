<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status</title>
    <meta name="description" content="Service status and uptime history" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2322c55e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" id="brand" href="./">
          <img id="brand-logo" alt="" hidden />
          <span id="brand-title">Status</span>
        </a>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><g stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3" /></g></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" /></svg>
        </button>
      </div>
    </header>

    <main class="shell">
      <section id="banner" class="banner banner-none">
        <span class="banner-dot"></span>
        <div>
          <h1 id="banner-title">Loading status…</h1>
          <p id="banner-meta" class="banner-meta"></p>
        </div>
      </section>

      <div class="list-head">
        <h2 class="section-title">Monitors</h2>
      </div>

      <div id="monitors" class="monitors"></div>

      <p id="empty" class="empty" hidden>
        No monitors configured. Add a repository variable named
        <code>MONITOR_&lt;NAME&gt;</code> to get started.
      </p>

      <section id="incidents" hidden>
        <div class="list-head">
          <h2 class="section-title">Incidents</h2>
        </div>
        <ul id="incident-list" class="incident-list"></ul>
      </section>
    </main>

    <footer class="shell footer">
      <span id="updated"></span>
      <a id="repo-link" href="#" hidden>Source</a>
    </footer>

    <dialog id="detail" class="detail">
      <button id="detail-close" class="icon-button detail-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" /></svg>
      </button>
      <div id="detail-body"></div>
    </dialog>

    <div id="tooltip" class="tooltip" hidden></div>
    <script src="app.js" type="module"></script>
  </body>
</html>
