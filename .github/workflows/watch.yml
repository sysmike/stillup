name: Watch

# GitHub may hold a workflow run for approval, and a held run does nothing, so
# it cannot say so itself. This looks from outside and keeps an issue open for
# as long as anything is held. All it does is in scripts/watch.mjs: a changed
# workflow file is what gets held, so this file is meant to stay as it is.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository != (vars.SYNC_UPSTREAM || 'sysmike/stillup')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Look for held runs
        env:
          SITE_LANG: ${{ vars.SITE_LANG }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/watch.mjs
