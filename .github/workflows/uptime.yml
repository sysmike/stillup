name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # Opening, closing or relabelling an incident changes what the page shows, so
  # refresh the snapshot and deploy right away. Issues that the workflow itself
  # opens and closes use GITHUB_TOKEN and do not trigger another run.
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.incidents.outputs.changed }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Run checks
        env:
          CONFIG_VARS: ${{ toJSON(vars) }}
          CONFIG_SECRETS: ${{ toJSON(secrets) }}
        run: node scripts/check.mjs

      - name: Update incidents
        id: incidents
        env:
          CONFIG_VARS: ${{ toJSON(vars) }}
          CONFIG_SECRETS: ${{ toJSON(secrets) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/incidents.mjs

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --quiet --cached && exit 0
          git commit -m "chore: status $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          exit 1

  # Pages rebuilds on its own once a day; this keeps an outage from waiting
  # for that tick.
  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    # Monitors may be defined as secrets, which the build needs to name them.
    secrets: inherit
