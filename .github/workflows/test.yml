name: Test

on:
  push:
    paths:
      - 'scripts/**'
      - 'test/**'
      # The suite reads the dictionaries, the page, the stylesheet and the
      # workflows: it checks them against each other, so a change to any of
      # them has to run it.
      - 'site/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      # The suite reads the dictionaries, the page, the stylesheet and the
      # workflows: it checks them against each other, so a change to any of
      # them has to run it.
      - 'site/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test
