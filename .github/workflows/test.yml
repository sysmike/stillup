name: Test

on:
  push:
    paths:
      - 'scripts/**'
      - 'test/**'
      # The dictionaries are held to each other by the same suite, and app.js is
      # scanned for keys that no dictionary has.
      - 'site/lang/**'
      - 'site/app.js'
      - 'site/index.html'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      # The dictionaries are held to each other by the same suite, and app.js is
      # scanned for keys that no dictionary has.
      - 'site/lang/**'
      - 'site/app.js'
      - 'site/index.html'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test
