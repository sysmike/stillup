name: Pages

on:
  workflow_call:
  workflow_dispatch:
  # The page refreshes status, uptime and the newest bars from history/live.json
  # on its own, and an outage deploys immediately from the Uptime workflow. This
  # rebuild is the floor: it refreshes the whole 90 day history and the response
  # time chart once a day.
  schedule:
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Checks out the branch head so the history committed by the Uptime
      # workflow moments earlier is included.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Build site
        env:
          CONFIG_VARS: ${{ toJSON(vars) }}
          CONFIG_SECRETS: ${{ toJSON(secrets) }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
