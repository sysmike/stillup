name: Planned maintenance
description: Announce a maintenance window on the status page
title: 'Maintenance: '
labels: ['status', 'maintenance']
body:
  - type: markdown
    attributes:
      value: |
        This issue is shown on the status page while it is open, and stays
        listed until 30 days after it was created. Close it when the work is
        done. Opening or closing it rebuilds the page within a minute or two.

        Keep the title short and put the window in it, for example
        `Maintenance: database upgrade, 2026-03-14 02:00 UTC`.
  # The start is read off this field, so work announced for next week is listed
  # as upcoming rather than as happening now. Write the date as 2026-03-14, with
  # an optional 24 hour time; anything else is treated as no window at all.
  # Renaming this label means setting WINDOW_HEADING to match.
  - type: input
    id: window
    attributes:
      label: Window
      description: Start and end, in UTC. Begin with the date, as 2026-03-14 02:00.
      placeholder: 2026-03-14 02:00 - 04:00 UTC
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      placeholder: The API returns 503 for up to ten minutes while the database fails over.
    validations:
      required: true
  # GitHub turns this label into a heading in the issue body, and that heading
  # is how the page finds which monitors an issue names. Rename it and set the
  # MONITORS_HEADING variable to match, or the linking stops working silently.
  - type: input
    id: monitors
    attributes:
      label: Affected monitors
      description: Names as they appear on the status page.
      placeholder: Public API, Documentation
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Rollback plan, contact, ticket references.
